<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPantry - Lista de Compras Inteligente</title>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Ferramenta de inspeção para celular -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --accent: #d32f2f;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
            --text-muted: #666666;
            --border: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1100px; margin: 0 auto; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; background: var(--card-bg); padding: 20px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 { color: var(--primary); font-size: 1.5rem; }

        .container { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .container { grid-template-columns: 2fr 1fr; } }

        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-title { font-size: 1.1rem; margin-bottom: 16px; font-weight: bold; }

        .item-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        input, button {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        button.btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .item-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
        }
        .item-card.alert { border-left: 5px solid var(--accent); background-color: #fff8f8; }

        .offer-card {
            border: 1px solid var(--border); padding: 12px; border-radius: 8px;
            margin-bottom: 12px; background-color: #fafafa;
        }
        .offer-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .store-name { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); }
        .price { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        .savings { font-size: 0.8rem; color: var(--accent); font-weight: 500; margin-top: 4px; }
        .status-tag { font-size: 0.75rem; color: #1565c0; font-weight: bold; margin-bottom: 8px; display: block; }
    </style>
</head>
<body>

    <header>
        <h1>SmartPantry 🛒</h1>
        <span id="db-status">🌐 Conectando ao Banco...</span>
    </header>

    <div class="container">
        <main>
            <div class="card">
                <h2 class="card-title">➕ Cadastrar Item no Estoque</h2>
                <form class="item-form" id="addForm">
                    <input type="text" id="itemName" placeholder="Ex: Arroz Tio João 5kg" required>
                    <input type="number" id="itemQty" placeholder="Qtd Atual" min="1" required>
                    <input type="number" id="itemDays" placeholder="Dura quantos dias?" min="1" required>
                    <button type="submit" class="btn-add">Adicionar</button>
                </form>
            </div>

            <div class="card">
                <h2 class="card-title">📦 Meu Estoque Doméstico</h2>
                <div id="pantryList"></div>
            </div>
        </main>

        <aside>
            <div class="card">
                <h2 class="card-title">🏷️ Ofertas do Encarte Hoje</h2>
                <span class="status-tag">🔄 Atualizado direto da base de dados</span>
                <div id="offersList">Carregando ofertas...</div>
            </div>
        </aside>
    </div>

    <script>
        // Configurações do Supabase
        const SUPABASE_URL = 'https://uieivwndolygefxrdvow.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_qjmfpBsObQazixM8cVds5A_lHrivH7Y';

        let db = null;

        try {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("Erro ao inicializar Supabase:", e);
        }

        let pantry = [
            { id: 1, name: "Arroz Tio João 5kg", qty: 1, daysPerUnit: 15, lastPurchased: "2026-07-20" },
            { id: 2, name: "Café Pilão 500g", qty: 1, daysPerUnit: 10, lastPurchased: "2026-07-25" }
        ];

        async function carregarPrecosDoDia() {
            const offersList = document.getElementById('offersList');
            const dbStatus = document.getElementById('db-status');

            if (!db) {
                dbStatus.innerText = "🔴 Chave do Banco Inválida";
                offersList.innerHTML = '<p style="color:red;">Verifique se a chave do Supabase foi colada corretamente.</p>';
                return;
            }

            try {
                const { data: promocoes, error } = await db.from('promocoes').select('*');

                if (error) throw error;

                dbStatus.innerText = "🟢 Conectado à Base de Preços";
                offersList.innerHTML = '';

                if (!promocoes || promocoes.length === 0) {
                    offersList.innerHTML = '<p style="font-size:0.85rem; color:var(--text-muted);">Nenhuma promoção encontrada no banco.</p>';
                    return;
                }

                promocoes.forEach(item => {
                    const preco = Number(item.preco) || 0;
                    const precoMedio = Number(item.preco_medio) || 0;
                    const economia = (precoMedio - preco).toFixed(2);

                    const offerHTML = `
                        <div class="offer-card">
                            <div class="offer-header">
                                <span class="store-name">${item.mercado || 'Mercado'}</span>
                                <span class="price">R$ ${preco.toFixed(2)}</span>
                            </div>
                            <div><strong>${item.produto || 'Produto'}</strong></div>
                            <div class="savings">Economia de R$ ${economia} em relação à média</div>
                        </div>
                    `;
                    offersList.innerHTML += offerHTML;
                });

            } catch (err) {
                console.error("Erro ao carregar ofertas:", err);
                dbStatus.innerText = "🔴 Erro de Busca";
                offersList.innerHTML = `<p style="color:red; font-size:0.8rem;"><b>Erro:</b> ${err.message || err}</p>`;
            }
        }

        function renderPantry() {
            const pantryList = document.getElementById('pantryList');
            pantryList.innerHTML = '';

            pantry.forEach(item => {
                const itemHTML = `
                    <div class="item-card alert">
                        <div>
                            <strong>${item.name}</strong>
                            <p style="font-size:0.8rem; color:var(--text-muted);">Estoque: ${item.qty} un (Consumo: 1 un / ${item.daysPerUnit} dias)</p>
                        </div>
                        <span style="font-size:0.8rem; font-weight:bold; color:var(--accent);">⚠️ Repor em breve</span>
                    </div>
                `;
                pantryList.innerHTML += itemHTML;
            });
        }

        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('itemName').value;
            const qty = parseInt(document.getElementById('itemQty').value);
            const days = parseInt(document.getElementById('itemDays').value);

            pantry.push({ id: Date.now(), name: name, qty: qty, daysPerUnit: days, lastPurchased: new Date().toISOString().split('T')[0] });
            renderPantry();
            this.reset();
        });

        renderPantry();
        carregarPrecosDoDia();
    </script>
</body>
</html>
